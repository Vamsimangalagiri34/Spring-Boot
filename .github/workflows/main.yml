name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v6.2.0
        with:
          java-version: '17' # Change to your required Java version (e.g., '11', '17', '21')
          distribution: 'temurin' # Recommended distribution (e.g., temurin, zulu)
          cache: 'maven' # Optional: caches Maven dependencies automatically

      - name: Build with Maven
        run: mvn clean package
